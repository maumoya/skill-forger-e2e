# Lint: keyless checks on every PR (frontmatter, JSON, eval layout, risky patterns). No API key needed.
name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  lint:
    name: Lint skill
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint this repo
        run: bash skills/skill-forger-e2e/scripts/lint_skill.sh .

      - name: Lint catches broken skills
        run: bash tests/lint_cases.sh

      - name: Scaffold a skill and lint it
        run: |
          bash skills/skill-forger-e2e/scripts/new_skill.sh demo-skill "$RUNNER_TEMP/demo" "CI" ci "Demo skill."
          bash "$RUNNER_TEMP/demo/scripts/lint_skill.sh" "$RUNNER_TEMP/demo"

      - name: Retrofit the eval fixture and score it
        run: |
          cp -R evals/retrofit-and-score/files/haiku-coach "$RUNNER_TEMP/haiku"
          before=$(bash skills/skill-forger-e2e/scripts/readiness.sh "$RUNNER_TEMP/haiku" | sed -n 's/^SCORE \([0-9]*\).*/\1/p')
          bash skills/skill-forger-e2e/scripts/retrofit.sh "$RUNNER_TEMP/haiku" "CI" ci
          bash skills/skill-forger-e2e/scripts/lint_skill.sh "$RUNNER_TEMP/haiku"
          after=$(bash skills/skill-forger-e2e/scripts/readiness.sh "$RUNNER_TEMP/haiku" | sed -n 's/^SCORE \([0-9]*\).*/\1/p')
          echo "readiness $before -> $after"
          [ "$after" -gt "$before" ]
          git diff --no-index --quiet evals/retrofit-and-score/files/haiku-coach/skills "$RUNNER_TEMP/haiku/skills"

      - name: Marketplace rules catch a bad action.yml
        run: |
          bash skills/skill-forger-e2e/scripts/marketplace_check.sh .
          bad="$RUNNER_TEMP/bad-action"; mkdir -p "$bad"; cp -R skills .claude-plugin "$bad"/
          printf 'name: Bad: name\ndescription: %s\nbranding:\n  color: pink\nruns:\n  using: composite\n' "$(printf 'x%.0s' $(seq 130))" > "$bad/action.yml"
          out=$(bash skills/skill-forger-e2e/scripts/marketplace_check.sh "$bad") && exit 1
          echo "$out"
          for want in "unquoted ': '" "130 chars" "no branding.icon" "branding.color 'pink'"; do grep -qF "$want" <<<"$out"; done

      - name: Benefit badges need a measured Results section
        run: |
          b=skills/skill-forger-e2e/scripts/badges.sh
          out="$(bash skills/skill-forger-e2e/scripts/bench.sh . --json tests/fixtures/bench-result.json --out "$RUNNER_TEMP/bench.md")"
          grep -qF '| Runs passed | 75% | 25% | +50 pts |' <<<"$out"
          if bash $b ci/demo --benefit 'runs passed=+50 pts' >/dev/null 2>&1; then exit 1; fi
          if bash $b ci/demo --results '#r' --benefit 'runs passed=+50 pts' >/dev/null 2>&1; then exit 1; fi
          if bash $b ci/demo --results '#r' --from "$RUNNER_TEMP/bench.md" --benefit 'runs passed=+60 pts' >/dev/null 2>&1; then exit 1; fi
          out="$(bash $b ci/demo --results '#r' --from "$RUNNER_TEMP/bench.md" --benefit 'runs passed=+50 pts')"
          grep -q 'runs%20passed-.*2da44e' <<<"$out"

      - name: Make a header image
        run: |
          bash skills/skill-forger-e2e/scripts/make_header.sh "$RUNNER_TEMP/hdr" --repo ci/demo --head "Say the job." --head2 "Get the result." --chip "a" --line '$ demo' --line '✓ ok'
          test -s "$RUNNER_TEMP/hdr/header.svg"

      - name: Readiness score through the repo's own action
        uses: ./
        with:
          min-score: 80

      - name: The action fails a repo below min-score
        id: low
        continue-on-error: true
        uses: ./
        with:
          path: evals/retrofit-and-score/files/haiku-coach
          repo: ""
          lint: "false"
          min-score: 99

      - name: Assert the low-score run failed
        env:
          OUTCOME: ${{ steps.low.outcome }}
          SCORE: ${{ steps.low.outputs.score }}
        run: |
          echo "outcome=$OUTCOME score=$SCORE"
          [ "$OUTCOME" = failure ] && [ -n "$SCORE" ] && [ "$SCORE" -lt 99 ]
